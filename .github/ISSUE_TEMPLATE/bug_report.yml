name: Bug report
description: Report a value read wrongly, a missed change or an API that doesn't work as documented
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems must not be reported here: follow the [Security Policy](https://github.com/oito2/oito2_rs/security/policy).
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - oito2_foundation
        - oito2_settings
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, the expected behavior and the actual behavior.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop environment and session on Linux (e.g. Ubuntu 24.04, GNOME 46, Wayland), or the system version on Windows/macOS.
  - type: textarea
    id: output
    attributes:
      label: Output of print_settings
      description: Run `cargo run -p oito2_settings --example print_settings` from a clone and paste the output.
      render: text
