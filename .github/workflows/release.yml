name: Release

# Runs on a vX.Y.Z tag:
#   1. checks that the workspace version equals the tag;
#   2. publishes, in dependency order, the crates whose version is not on
#      crates.io yet, through trusted publishing (OIDC);
#   3. creates a draft GitHub Release with the changelog sections of the version.
#
# Trusted publishing only works for crates that already exist on crates.io, so
# the first version of each crate is published by hand before its tag is
# pushed; this workflow then finds it published, skips it and drafts the
# release. The `release` environment protects the OIDC exchange.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release at a time; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workspace version equals the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Lists, in dependency order, the crates whose version is not on
      # crates.io. Only "could not find" means "not published yet"; any other
      # error (network, registry) fails the job. Runs outside the workspace so
      # cargo looks the crates up in the registry, not among the members.
      - name: Find the versions missing from crates.io
        id: missing
        working-directory: ${{ runner.temp }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=""
          for crate in oito2_foundation oito2_settings; do
            if out=$(cargo info "$crate@$version" --registry crates-io 2>&1 >/dev/null); then
              echo "$crate@$version is already on crates.io"
            elif echo "$out" | grep -q "could not find"; then
              missing="$missing $crate"
            else
              echo "$out" >&2
              exit 1
            fi
          done
          echo "crates=${missing# }" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.missing.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Each `cargo publish` waits until the crate is available in the index,
      # so the next one can depend on it.
      - name: Publish the missing crates
        if: steps.missing.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.missing.outputs.crates }}
        run: |
          for crate in $CRATES; do
            cargo publish -p "$crate" --locked
          done

  release:
    name: Draft the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The notes concatenate the version's section of every crate's CHANGELOG.
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Crates: \`oito2_foundation = \"$version\"\` and \`oito2_settings = \"$version\"\` on crates.io."
            echo
            for dir in crates/*/; do
              name=$(basename "$dir")
              if [ ! -f "${dir}CHANGELOG.md" ]; then continue; fi
              section=$(awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && /^## / { exit }
                found && /^\[[^]]+\]: / { exit }
                found { print }
              ' "${dir}CHANGELOG.md")
              if [ -z "$section" ]; then continue; fi
              echo "### $name"
              echo
              echo "$section"
              echo
            done
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
