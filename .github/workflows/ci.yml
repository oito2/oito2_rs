name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs of different events don't cancel each other, and only pull request
# runs give way to a newer push to the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, docs and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every platform reports its result, even when another one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development files and a session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev dbus
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Linux tests talk to the settings portal through the session bus.
      - name: Test (Linux, inside a session bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test --workspace --all-features --locked
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features --locked

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every rustup proxy, the cache action's probe included, uses the MSRV of
    # Cargo.toml instead of the toolchain pinned in rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: '1.90'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      - run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.90 check --workspace --all-features --locked
