# Configuration of `cargo deny check`: advisories, licenses, duplicate
# versions and dependency sources, resolved for every feature on the three
# supported targets.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained; it reaches the graph only through
    # glib-macros 0.18, and gio/glib stay on 0.18 to match the gtk crate Tauri
    # uses. Reassess when the GLib bindings line moves.
    { id = "RUSTSEC-2024-0370", reason = "pulled by glib-macros 0.18 (pinned line); no safe upgrade" },
    # glib 0.18 has an unsound `VariantStrIter` (string-array iteration of a
    # Variant); fixed in 0.20, which would duplicate the GLib bindings next to
    # Tauri's gtk 0.18. This workspace never iterates string arrays through
    # `VariantStrIter`. Reassess when the GLib bindings line moves.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 pinned to Tauri's gtk line; VariantStrIter is not used here" },
]

[licenses]
# The crates of this workspace are GPL-3.0-only; every dependency must use a
# license compatible with it.
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
